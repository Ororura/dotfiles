# -*- mode: tmux -*-

# Базовые настройки
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
set -g history-limit 10000
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Префикс (Ctrl+a)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Разделение панелей
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Навигация между панелями
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ресайз панелей
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Переключение окон
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Минималистичный статус-бар
set -g status-position bottom
set -g status-style "bg=default,fg=grey"
set -g status-left ""
set -g status-right "#[fg=default]%H:%M %d.%m.%y"

# Стиль окон
set -g window-status-current-format "#[fg=white,bold]#I:#W#F"
set -g window-status-format "#[fg=grey]#I:#W#F"

# Границы панелей
set -g pane-active-border-style "fg=blue"
set -g pane-border-style "fg=grey"

# Уведомления
set -g visual-activity off
set -g visual-bell off
set -g monitor-activity off

# Копирование (vi-режим)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Плагины
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Инициализация TPM
run '~/.tmux/plugins/tpm/tpm'
